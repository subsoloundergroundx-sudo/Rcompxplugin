name: Build VST3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + JUCE fetched automatically)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RCompX_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCompX-VST3
          path: build/RCompX_artefacts/Release/VST3/
